name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync

      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: uv run pytest
